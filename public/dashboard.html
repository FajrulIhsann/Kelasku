<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Harian - Kelasku</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <script>
    try {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 block">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 dark:bg-slate-950 text-slate-300 flex flex-col border-r border-slate-800 transform transition-transform duration-300 ease-in-out">
    <div class="p-6 border-b border-slate-800 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0">
          <span data-icon="logo" data-cls="w-5 h-5 text-white"></span>
        </span>
        <h2 class="text-xl font-bold text-white tracking-wider">Kelasku</h2>
      </div>
      <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1.5 rounded-xl hover:bg-slate-800 transition" title="Tutup Sidebar">
        <span data-icon="close" data-cls="w-5 h-5"></span>
      </button>
    </div>
    <nav class="p-4 flex flex-col gap-2 flex-1">
      <div class="space-y-2">
      <a id="navDashboard" href="/dashboard" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium bg-slate-700 text-white transition">
        <span data-icon="home" data-cls="w-4 h-4"></span>
        Dashboard
      </a>
      <a id="navHome" href="/jadwal" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
        <span data-icon="book" data-cls="w-4 h-4"></span>
        Jadwal Pelajaran
      </a>
      <a id="navTugas" href="/tugas" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
        <span data-icon="task" data-cls="w-4 h-4"></span>
        <span class="flex-1 text-left">Tugas</span>
        <span id="tugasBadge" title="" class="hidden text-xs font-bold text-slate-400">0</span>
      </a>
      </div>
      <a id="navApi" href="/generate-api" class="mt-auto w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">
        <span data-icon="code" data-cls="w-4 h-4"></span>
        API Generator
      </a>
    </nav>
  </aside>

  <!-- Main Area -->
  <div id="mainContent" class="md:ml-64 flex flex-col min-h-screen bg-white dark:bg-slate-900 transition-all duration-300 ease-in-out">
    <div id="toastNotification" class="fixed top-8 left-1/2 transform -translate-x-1/2 bg-slate-900 dark:bg-indigo-600 text-white px-5 py-3 rounded-2xl shadow-xl border border-slate-700 flex items-center gap-2.5 text-sm z-50 opacity-0 transition-all duration-300 pointer-events-none scale-95">
      <span data-icon="check" data-cls="w-5 h-5 text-emerald-400 dark:text-white"></span>
      <span class="font-medium">Tersimpan</span>
    </div>

    <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-7xl w-full mx-auto px-6 pt-8 pb-6">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
          <div class="flex items-center gap-3 w-full md:w-auto">
            <button id="openSidebarBtn" onclick="toggleSidebar()" class="hidden p-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Buka Sidebar">
              <span data-icon="menu" data-cls="w-5 h-5"></span>
            </button>
            <div>
              <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Dashboard Harian</h1>
              <p id="dashboardSubtitle" class="text-sm text-slate-500 dark:text-slate-400">Memuat...</p>
              <p id="liveClock" class="text-sm font-semibold text-indigo-600 dark:text-indigo-400 tabular-nums">--:--:--</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Toggle Dark Mode">
              <span data-icon="sun" data-cls="w-5 h-5 hidden dark:block text-amber-400"></span>
              <span data-icon="moon" data-cls="w-5 h-5 block dark:hidden text-slate-600"></span>
            </button>
            <button onclick="loadDashboard(true)" class="bg-slate-900 dark:bg-indigo-600 hover:opacity-90 text-white font-medium px-5 py-2.5 rounded-xl shadow transition text-sm">
              ↻ Refresh
            </button>
          </div>
        </header>

        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-center gap-4 transition-colors">
          <label for="dashClassSelect" class="font-semibold text-slate-700 dark:text-slate-200">Kelas favorit:</label>
          <select id="dashClassSelect" onchange="onDashClassChange()" class="w-full sm:w-72 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100">
            <option value="">-- Pilih Kelas --</option>
          </select>
          <span class="text-xs text-slate-400 dark:text-slate-500">Pilihan tersimpan otomatis di browser ini.</span>
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 flex-1">
      <div class="max-w-7xl w-full mx-auto px-6 py-6 space-y-6">

        <!-- Stat cards -->
        <div id="statCards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>

        <!-- Jadwal fokus (1 kartu: hari ini / besok tergantung jam cutoff 15:00 WIB) -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
          <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
            <div class="flex items-center gap-2">
              <h2 id="fokusTitle" class="font-bold text-base text-slate-800 dark:text-white">Jadwal</h2>
              <span id="fokusBadge" class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300">HARI INI</span>
            </div>
            <a href="/jadwal" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:underline">Lihat semua →</a>
          </div>
          <div id="fokusSchedule"></div>
        </div>

        <!-- Tugas hari ini -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
          <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">
            <h2 class="font-bold text-base text-slate-800 dark:text-white">Tugas Hari Ini</h2>
            <a href="/tugas" class="text-xs font-bold text-emerald-600 dark:text-emerald-400 hover:underline">Kelola tugas →</a>
          </div>
          <div id="todayTasks" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- Tugas lain -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm">
          <h2 class="font-bold text-base text-slate-800 dark:text-white mb-4 pb-2 border-b border-slate-100 dark:border-slate-700">Tugas Lain <span class="text-xs font-normal text-slate-400">(3 hari ke depan)</span></h2>
          <div id="upcomingTasks" class="space-y-3"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
